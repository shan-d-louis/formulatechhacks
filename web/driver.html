<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SIDEWALL Driver</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  html, body { height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { display: flex; flex-direction: column; }
  .hud { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; gap: 10px; }
  .hud .spd { font-family: var(--mono); font-size: 34px; font-weight: 800; }
  .hud .call { font-weight: 800; letter-spacing: .05em; padding: 6px 10px; border-radius: 8px; background: #1a1e25; }
  .pedals { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 12px 16px; }
  .pedal { position: relative; border-radius: 18px; border: 2px solid #2a303b; overflow: hidden; display: flex;
    align-items: flex-end; justify-content: center; padding-bottom: 18px; font-weight: 800; letter-spacing: .12em; }
  .pedal .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; opacity: .85; }
  .pedal span { position: relative; }
  #brake .fill { background: linear-gradient(0deg, #ff3040, #ff7a1a); }
  #throttle .fill { background: linear-gradient(0deg, #13a85a, #2fd27a); }
  .hint { text-align: center; font-size: 12px; color: var(--muted); padding: 0 16px 8px; }
  .flash { animation: fl .25s; } @keyframes fl { 50% { background: #ff3040; } }
</style>
</head>
<body>
  <div class="hud">
    <div><div class="spd" id="spd">–</div><div class="muted" id="gear" style="font-size:12px">gear –</div></div>
    <div class="call" id="call">connecting…</div>
  </div>
  <div class="hint">Press and slide up for more. Brake too late → lock-up. Too much throttle out of slow corners → wheelspin.</div>
  <div class="pedals">
    <div class="pedal" id="brake"><div class="fill"></div><span>BRAKE</span></div>
    <div class="pedal" id="throttle"><div class="fill"></div><span>THROTTLE</span></div>
  </div>
<script>
const $ = (id) => document.getElementById(id);
const state = { throttle: 0, brake: 0 };
let ws;
function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/driver`);
  ws.onopen = () => $("call").textContent = "READY";
  ws.onclose = () => { $("call").textContent = "reconnecting…"; setTimeout(connect, 1500); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === "feel") {
      $("spd").textContent = m.speed != null ? Math.round(m.speed) : "–";
      $("gear").textContent = `gear ${m.gear ?? "–"}`;
      $("call").textContent = m.call || "OK";
      $("call").style.color = ["#2fd27a", "#ffc233", "#ff7a1a", "#ff3040"][m.level || 0];
      if ((m.lockup || m.wheelspin) && navigator.vibrate) navigator.vibrate(m.lockup ? 120 : 60);
      if (m.lockup) { document.body.classList.remove("flash"); void document.body.offsetWidth; document.body.classList.add("flash"); }
    }
  };
}
connect();
// Each pedal: the higher the finger, the more pedal. Multi-touch so both can be pressed.
function bind(id) {
  const el = $(id), fill = el.querySelector(".fill");
  const set = (v) => { state[id] = v; fill.style.height = `${v * 100}%`; };
  const fromTouch = (y) => { const r = el.getBoundingClientRect(); return Math.min(1, Math.max(0.15, (r.bottom - y) / r.height * 1.25)); };
  el.addEventListener("pointerdown", (e) => { el.setPointerCapture(e.pointerId); set(fromTouch(e.clientY)); });
  el.addEventListener("pointermove", (e) => { if (e.buttons || e.pressure) set(fromTouch(e.clientY)); });
  const up = () => set(0);
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up); el.addEventListener("lostpointercapture", up);
}
bind("brake"); bind("throttle");
setInterval(() => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "input", ...state })); }, 50);
</script>
</body>
</html>
