<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0e13">
<title>Lightning Response · AI tyre safety</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="home-page">
<header class="topbar home-topbar">
  <a class="brand" href="/" aria-label="Lightning Response home"><img src="/static/lightning-response.png" alt="Lightning Response"></a>
</header>
<main>
  <section class="home-hero" aria-labelledby="home-title">
    <div class="hero-copy">
      <h1 id="home-title">Tyre safety dashboard</h1>
      <p class="hero-lead">Choose a way to explore Lightning Response.</p>
    </div>
    <div class="hero-art" aria-hidden="true"><img src="/static/lightning-response.png" alt=""></div>
  </section>
  <nav class="home-paths" aria-label="Explore Lightning Response">
    <a class="path-card replay" href="/pitwall?mode=replay&amp;scenario=silverstone2020">
      <span class="path-icon" aria-hidden="true">↗</span>
      <span class="path-title">Race replay</span>
      <span class="path-copy">Review a tyre-risk scenario from a real race.</span>
      <span class="path-action">Open replay <span aria-hidden="true">→</span></span>
    </a>
    <a class="path-card simulator" href="/pitwall?mode=live">
      <span class="path-icon" aria-hidden="true">↗</span>
      <span class="path-title">Drive simulator</span>
      <span class="path-copy">Try braking and throttle inputs in the simulator.</span>
      <span class="path-action">Open simulator <span aria-hidden="true">→</span></span>
    </a>
    <a class="path-card data" href="/atlas">
      <span class="path-icon" aria-hidden="true">↗</span>
      <span class="path-title">Tyre data</span>
      <span class="path-copy">Explore stint, degradation and model findings.</span>
      <span class="path-action">View data <span aria-hidden="true">→</span></span>
    </a>
  </nav>
</main>
</body>
</html>
